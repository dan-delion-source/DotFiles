# GTK3 has no style manager, so dark mode is requested here; the colours come
# from the gtk.css the palette push writes beside this file. The font is set
# so GTK3 apps don't fall back to whatever fontconfig picks.

# `danshell` is generated by the palette push: Papirus with the folder colour
# nearest the accent. QuickShell creates it on the first palette push.

[Settings]
gtk-theme-name=Adwaita
gtk-icon-theme-name=danshell
gtk-application-prefer-dark-theme=1
gtk-cursor-theme-name=default
gtk-cursor-theme-size=24
gtk-font-name=Adwaita Sans 11
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb
