[bar.default]
position = "left"
thickness = 35
concave_edge_corners = true
margin_edge = 8
margin_ends = 8
radius_bottom_left = 15
radius_bottom_right = 15
radius_top_left =15
radius_top_right = 15
scale = 1.05
start = [ "launcher", "workspaces" ]
center = [ "media" ]
monitors = [ "eDP-1" ]
# Vidgex-inspired widgets on the existing sidebar, without oval containers.
capsule = false
capsule_group = []
end = [ "network", "volume", "brightness", "sysmon_temp", "sysmon_cpu", "sysmon_ram", "sysmon_gpu", "battery", "clock" ]


[bar.default.monitor.hdmi]
match = "HDMI-A-5"
enabled = false

[widget.launcher]
glyph = "0xf303"
color = "secondary"
custom_image = "/usr/share/pixmaps/archlinux-logo.svg"
custom_image_colorize = true
# point this at an Arch logo if you want the launcher button itself to be the logo:
# custom_image = "/usr/share/pixmaps/archlinux-logo.svg"

[widget.workspaces]
show_labels = false
capsule = false
active_pill_size = 1.5
inactive_pill_size = 1.0
pill_scale = 0.9

[widget.media]
hide_when_no_media = true
title_scroll = "on_hover"

[widget.clock]
format = "{:%H:%M}"
vertical_format = "{:%H\n%M}"
color = "primary"
capsule = false

# Small icon gauges follow the reference; exact readings remain in tooltips.
[widget.sysmon_temp]
type = "sysmon"
stat = "cpu_temp"
visualization = "gauge"
show_glyph = true
show_value = false
color = "primary"
capsule = false

[widget.sysmon_cpu]
type = "sysmon"
stat = "cpu_usage"
visualization = "gauge"
show_glyph = true
show_value = false
color = "primary"
capsule = false

[widget.sysmon_ram]
type = "sysmon"
stat = "ram_pct"
visualization = "gauge"
show_glyph = true
show_value = false
color = "primary"
capsule = false

[widget.sysmon_gpu]
type = "sysmon"
stat = "gpu_usage"
visualization = "gauge"
show_glyph = true
show_value = false
color = "primary"
capsule = false

# Native battery glyph: Noctalia has no config-only circular battery gauge.
[widget.battery]
display_mode = "glyph"
show_label = false
color = "primary"
warning_color = "error"
capsule = false

[widget.network]
color = "primary"
show_label = false
capsule = false

[widget.volume]
color = "secondary"
show_label = false

[widget.brightness]
color = "secondary"
show_label = false

[shell.mpris]
blacklist = ["firefox", "chromium", "brave", "vlc", "mpv", "zen"]




[theme.templates]
builtin_ids = [ "btop", "gtk3", "gtk4", "kcolorscheme", "kitty", "alacritty", "qt" ]

[theme]
mode = "dark"
source = "custom"
custom_palette = "Matugen"

[hooks]
wallpaper_changed = [
  "matugen image \"$NOCTALIA_WALLPAPER_PATH\" --config \"$HOME/.config/matugen/config.toml\" --mode dark --type scheme-tonal-spot --source-color-index 0",
  "noctalia msg color-scheme-set custom Matugen",
  "noctalia msg templates-apply",
  "hyprctl reload"
]
