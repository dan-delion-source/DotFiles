# ── FONT ──────────────────────────────────────────────────────

# ── WINDOW ────────────────────────────────────────────────────
# Use the account login shell.
background_opacity 0.6
confirm_os_window_close 0

# ── REMOTE CONTROL ────────────────────────────────────────────
allow_remote_control socket-only
listen_on unix:${XDG_RUNTIME_DIR}/kitty.sock

# ── CURSOR ────────────────────────────────────────────────────
cursor_shape block
cursor_trail 1

# ── SCROLLBACK & BELL ──────────────────────────────────────────
scrollback_lines 10000
enable_audio_bell no

# ── FALLBACK COLORS ───────────────────────────────────────────
background #000000
foreground #dddddd
cursor #ffffff
selection_background #56b6c2
selection_foreground #000000

active_tab_background #56b6c2
active_tab_foreground #000000
inactive_tab_background #000000
inactive_tab_foreground #dddddd

color0  #4c4c4c
color1  #bb0000
color2  #5ede8f
color3  #f2f067
color4  #266ad7
color5  #bb00bb
color6  #00d9df
color7  #bbbbbb
color8  #545454
color9  #ff5555
color10 #55ff55
color11 #ffff55
color12 #5555ff
color13 #ff55ff
color14 #55ffff
color15 #ffffff

font_family JetBrainsMono Nerd Font Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 10.5
window_padding_width 8

# ── THEME ─────────────────────────────────────────────────────
# Both Matugen and preset palettes are published by QuickShell here.
# globinclude allows a fresh install to start before the first generation.
globinclude danshell-colors.conf
globinclude danshell-font.conf
