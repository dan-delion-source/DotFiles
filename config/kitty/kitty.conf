# ── FONT ──────────────────────────────────────────────────────

# ── WINDOW ────────────────────────────────────────────────────
shell zsh
background_opacity 0.6
window_padding_width 25
confirm_os_window_close 0

# ── REMOTE CONTROL ────────────────────────────────────────────
allow_remote_control socket-only
listen_on unix:${XDG_RUNTIME_DIR}/kitty.sock

# ── CURSOR ────────────────────────────────────────────────────
cursor_shape block
cursor_trail 1

# ── SCROLLBACK & BELL ──────────────────────────────────────────
scrollback_lines 10000
enable_audio_bell no

# ── FALLBACK COLORS ───────────────────────────────────────────
background #000000
foreground #dddddd
cursor #ffffff
selection_background #56b6c2
selection_foreground #000000

active_tab_background #56b6c2
active_tab_foreground #000000
inactive_tab_background #000000
inactive_tab_foreground #dddddd

color0  #4c4c4c
color1  #bb0000
color2  #5ede8f
color3  #f2f067
color4  #266ad7
color5  #bb00bb
color6  #00d9df
color7  #bbbbbb
color8  #545454
color9  #ff5555
color10 #55ff55
color11 #ffff55
color12 #5555ff
color13 #ff55ff
color14 #55ffff
color15 #ffffff

# ── THEME ─────────────────────────────────────────────────────
# Keep Matugen last so its colors override the fallback palette.
include themes/matugen.conf

# Enable these only if your Quickshell theme manager generates them.
# The palette would override some Matugen colors if enabled.
# include ~/.local/state/quickshell/kitty-palette.conf
# include ~/.local/state/quickshell/kitty-font.conf
include themes/noctalia.conf


font_family JetBrains Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 10.5
window_padding_width 8
